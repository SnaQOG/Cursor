name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests
        
    - name: Debug Secret
      env:
        CURSOR_SECRET: ${{ secrets.cursor }}
      run: |
        echo "Secret exists: ${{ secrets.cursor != '' }}"
        echo "Validating secret format..."
        python << 'EOF'
import json
import os
import sys

try:
    secret = os.environ["CURSOR_SECRET"]
    print(f"Secret length: {len(secret)}")
    config = json.loads(secret)
    print("\nConfig keys:", list(config.keys()))
    print("\nTelegram config:")
    print(f"- BOT_TOKEN length: {len(config.get('TELEGRAM_BOT_TOKEN', ''))}")
    print(f"- CHAT_ID: {config.get('TELEGRAM_CHAT_ID', 'Not found')}")
    
    # Validate required fields
    required_fields = [
        "TELEGRAM_BOT_TOKEN",
        "TELEGRAM_CHAT_ID",
        "TRADING_PAIRS",
        "TRADING_TIMEFRAMES"
    ]
    
    missing = [field for field in required_fields if field not in config]
    if missing:
        print(f"\nError: Missing required fields: {missing}")
        sys.exit(1)
        
    print("\nSecret validation successful!")
except json.JSONDecodeError as e:
    print(f"\nError: Invalid JSON format - {str(e)}")
    sys.exit(1)
except Exception as e:
    print(f"\nError: {str(e)}")
    sys.exit(1)
EOF
        
    - name: Create config and start bot
      env:
        CURSOR_SECRET: ${{ secrets.cursor }}
      run: |
        # Create config file
        echo "$CURSOR_SECRET" > config.json
        
        # Show config structure (ohne sensitive Daten)
        echo "Config structure:"
        python -c "
import json
with open('config.json') as f:
    config = json.load(f)
    # Zeige Struktur ohne sensitive Werte
    safe_config = {k: ('***' if k in ['OPENAI_API_KEY', 'GEMINI_API_KEY', 'TELEGRAM_BOT_TOKEN'] else v) for k, v in config.items()}
    print(json.dumps(safe_config, indent=2))
"
        
        # Create .env file
        echo "Creating .env file..."
        cat > create_env.py << 'EOF'
        import json
        import sys
        
        try:
            with open("config.json") as f:
                config = json.load(f)
            
            with open(".env", "w") as f:
                for key, value in config.items():
                    if isinstance(value, (list, dict)):
                        f.write(f"{key}={json.dumps(value)}\n")
                    else:
                        f.write(f"{key}={value}\n")
            print("Successfully created .env file")
        except Exception as e:
            print(f"Error: {str(e)}", file=sys.stderr)
            sys.exit(1)
        EOF
        
        python create_env.py
        
        # Show .env content (ohne sensitive Daten)
        echo "Checking .env file structure..."
        grep -v "_KEY\|TOKEN\|ID" .env || true
        
        echo "Setup completed successfully"

  notify:
    needs: [deploy]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: pip install requests
        
    - name: Send notification
      env:
        CURSOR_SECRET: ${{ secrets.cursor }}
        DEPLOY_STATUS: ${{ needs.deploy.result }}
      run: |
        cat > send_notification.py << 'EOF'
        import json
        import os
        import sys
        import requests
        
        try:
            config = json.loads(os.environ["CURSOR_SECRET"])
            status = os.environ["DEPLOY_STATUS"]
            
            bot_token = config.get("TELEGRAM_BOT_TOKEN")
            chat_id = config.get("TELEGRAM_CHAT_ID")
            
            print("Debug - Bot Token length:", len(bot_token) if bot_token else "None")
            print("Debug - Chat ID:", chat_id)
            print("Debug - Raw config:", json.dumps({k: v if k not in ['OPENAI_API_KEY', 'GEMINI_API_KEY'] else '***' for k, v in config.items()}, indent=2))
            
            if not bot_token or not chat_id:
                print("Error: Missing Telegram configuration")
                sys.exit(1)
            
            message = "✅ Deployment erfolgreich" if status == "success" else "❌ Deployment fehlgeschlagen"
            
            # Test Telegram API Erreichbarkeit
            test_response = requests.get(f"https://api.telegram.org/bot{bot_token}/getMe")
            print("Debug - Telegram API Test Response:", test_response.json())
            
            api_url = f"https://api.telegram.org/bot{bot_token}/sendMessage"
            payload = {
                "chat_id": chat_id,
                "text": message,
                "parse_mode": "HTML"
            }
            
            print("Debug - API URL:", api_url.replace(bot_token, "BOT_TOKEN"))
            print("Debug - Payload:", payload)
            
            response = requests.post(api_url, json=payload)
            
            if not response.ok:
                print(f"Error sending message: {response.text}", file=sys.stderr)
                print("Debug - Response Status Code:", response.status_code)
                print("Debug - Response Headers:", dict(response.headers))
                sys.exit(1)
                
            print("Notification sent successfully")
            print("Debug - Success Response:", response.json())
            
        except Exception as e:
            print(f"Error: {str(e)}", file=sys.stderr)
            print("Debug - Exception type:", type(e).__name__)
            print("Debug - Environment variables:", dict(os.environ))
            sys.exit(1)
        EOF
        
        python send_notification.py 